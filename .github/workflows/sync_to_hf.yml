name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Prepare Clean Deployment Tree for Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret must be configured in your GitHub repository."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create a clean orphan deployment branch with no historical binary objects
          git checkout --orphan hf-sync-branch
          git reset

          # Remove local binary test samples and vector databases from git tracking
          rm -rf test_samples/*.m4a test_samples/*.pdf vector_db metadata.db test_samples/optimized_audio

          git add .
          git commit -m "deploy: automated clean build for Hugging Face Spaces"

          AUTH_URL="https://abaja:${HF_TOKEN}@huggingface.co/spaces/abaja/notes-taker"
          echo "[*] Pushing clean deployment branch to Hugging Face Space..."
          git push "$AUTH_URL" hf-sync-branch:main --force
