name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret must be configured in your GitHub repository."
            exit 1
          fi

          # Configure Git credentials for Hugging Face
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Target Space: https://huggingface.co/spaces/abaja/notes-taker
          AUTH_URL="https://abaja:${HF_TOKEN}@huggingface.co/spaces/abaja/notes-taker"

          echo "[*] Mirroring main branch to Hugging Face Space (abaja/notes-taker)..."
          git push "$AUTH_URL" main:main --force
